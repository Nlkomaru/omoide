name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check & Typecheck
        run: |
          pnpm run check:ci
          pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build Web with cf
        run: pnpm --filter @omoide/web exec cf build

      - name: Dry-run deploy
        run: pnpm --filter @omoide/web exec cf deploy --prebuilt --mode production --dry-run

      - name: Load Production Secrets
        uses: nlkomaru/secret-manager@main
        with:
          project: "omoide"
          env: "production"
          export-json: ${{ runner.temp }}/worker-secrets.json
          export-json-keys: |
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            GH_CLIENT_ID
            GH_CLIENT_SECRET
            ALLOWED_USERS
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_BUCKET_NAME
            R2_S3_ENDPOINT

      - name: Apply D1 Migrations & Deploy Production
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/worker-secrets.json"' EXIT
          CI=true pnpm --filter @omoide/web exec cf d1 migrations apply "$CLOUDFLARE_DATABASE_ID" --dir migrations
          CI=true pnpm --filter @omoide/web exec cf deploy --prebuilt --mode production --secrets-file "$RUNNER_TEMP/worker-secrets.json"
